<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="A simple home page published with GitHub Pages.">
	<title>Hello, GitHub Pages</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #18342d;
			--muted: #53645d;
			--paper: #f5f7f2;
			--accent: #d7ef72;
			--line: #dce3d9;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			grid-template-rows: auto 1fr auto;
			background: var(--paper);
			color: var(--ink);
			font-family: Georgia, "Times New Roman", serif;
		}

		header, footer {
			width: min(100% - 48px, 1080px);
			margin-inline: auto;
			display: flex;
			align-items: center;
			justify-content: space-between;
		}

		header {
			min-height: 82px;
			border-bottom: 1px solid var(--line);
			font-family: "Segoe UI", sans-serif;
			font-size: 14px;
		}

		.mark {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			font-weight: 700;
		}

		.mark-icon {
			width: 30px;
			aspect-ratio: 1;
			display: grid;
			place-items: center;
			border-radius: 50%;
			background: var(--accent);
			font-size: 16px;
		}

		a { color: inherit; }

		header a {
			text-decoration-thickness: 1px;
			text-underline-offset: 4px;
		}

		main {
			width: min(100% - 48px, 1080px);
			margin: auto;
			padding-block: clamp(72px, 15vh, 150px);
			animation: arrive 600ms ease-out both;
		}

		.eyebrow {
			margin: 0 0 22px;
			color: var(--muted);
			font: 700 12px/1.4 "Segoe UI", sans-serif;
			letter-spacing: 1.4px;
			text-transform: uppercase;
		}

		h1 {
			max-width: 760px;
			margin: 0;
			font-size: clamp(52px, 9vw, 112px);
			font-weight: 400;
			line-height: .98;
		}

		h1 span {
			display: block;
			color: #557246;
			font-style: italic;
		}

		.intro {
			max-width: 510px;
			margin: 30px 0 0;
			color: var(--muted);
			font: 18px/1.7 "Segoe UI", sans-serif;
		}

		.button {
			min-height: 48px;
			margin-top: 34px;
			padding: 0 20px;
			display: inline-flex;
			align-items: center;
			gap: 12px;
			border-radius: 3px;
			background: var(--ink);
			color: white;
			font: 600 14px "Segoe UI", sans-serif;
			text-decoration: none;
			transition: background 160ms ease, transform 160ms ease;
		}

		.button:hover {
			transform: translateY(-2px);
			background: #2c5748;
		}

		.button:focus-visible, header a:focus-visible {
			outline: 3px solid #779348;
			outline-offset: 4px;
		}

		footer {
			min-height: 68px;
			border-top: 1px solid var(--line);
			color: var(--muted);
			font: 13px "Segoe UI", sans-serif;
		}

		@keyframes arrive {
			from { opacity: 0; transform: translateY(12px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after {
				animation-duration: .01ms !important;
				transition-duration: .01ms !important;
			}
		}

		@media (max-width: 520px) {
			header, footer, main { width: min(100% - 36px, 1080px); }
			header { min-height: 70px; }
			.intro { font-size: 16px; }
			footer { gap: 12px; font-size: 12px; }
		}
	</style>
</head>
<body>
	<header>
		<div class="mark"><span class="mark-icon" aria-hidden="true">✳</span> My little corner</div>
		<a href="https://github.com/">Find me on GitHub <span aria-hidden="true">↗</span></a>
	</header>

	<main>
		<p class="eyebrow">A small page on the internet</p>
		<h1>Hello, world.<span>Glad you're here.</span></h1>
		<p class="intro">This is my home on the web, published with GitHub Pages. A place for projects, notes, and whatever comes next.</p>
		<a class="button" href="https://docs.github.com/pages">Explore GitHub Pages <span aria-hidden="true">→</span></a>
	</main>

	<footer>
		<span>Made with care and a little HTML.</span>
		<span>© <span id="year">2026</span></span>
	</footer>
</body>
</html>
